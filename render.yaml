databases:
  - name: onlineexam-db
    databaseName: online_exam
    user: online_exam_user
    plan: free

services:
  - type: web
    name: onlineexam-backend
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: onlineexam-db
          property: connectionString
      - key: JWT_SECRET
        value: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
