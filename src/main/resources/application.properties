spring.application.name=online-examination-system

# Database Configuration
# Automatically supports Render PostgreSQL (via DATABASE_URL or DB_URL) with fallback to local MySQL
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/online_exam?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration (256-bit secret key)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# Server Port (Render dynamically assigns PORT environment variable)
server.port=${PORT:8080}
